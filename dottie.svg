  <text x="85" y="196.5" font-family="serif" font-size="5" fill="#1a2a4a" text-anchor="middle">✓</text>
  <path d="M 51 204 Q 59 200 65 204 Q 69 208 75 204" stroke="#2a3a7a" stroke-width="1.2" fill="none" stroke-linecap="round"/>

</svg>
