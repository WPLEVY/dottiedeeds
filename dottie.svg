  <rect x="45" y="160" width="50" height="10" rx="2" fill="#1a2a4a"/>
  <text x="70" y="168" font-family="Georgia, serif" font-size="4.5" fill="#c8a84a" text-anchor="middle" font-weight="bold">GRANT DEED</text>
  <line x1="51" y1="178" x2="89" y2="178" stroke="#c8c0b0" stroke-width="1.2"/>
  <line x1="51" y1="184" x2="89" y2="184" stroke="#c8c0b0" stroke-width="1.2"/>
