<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcbc3e"/><stop offset="1" stop-color="#b8960c"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5636"/><stop offset="1" stop-color="#6b4025"/></linearGradient>
    <clipPath id="badge"><circle cx="200" cy="200" r="150"/></clipPath>
  </defs>

  <circle cx="200" cy="200" r="168" fill="url(#ring)"/>
  <circle cx="200" cy="200" r="150" fill="#f5f0e8"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#1a1710" stroke-width="2" opacity="0.12"/>
  <g fill="#f5f0e8"><circle cx="200" cy="41" r="5"/><circle cx="359" cy="200" r="5"/><circle cx="200" cy="359" r="5"/><circle cx="41" cy="200" r="5"/><circle cx="313" cy="87" r="3.5"/><circle cx="313" cy="313" r="3.5"/><circle cx="87" cy="313" r="3.5"/><circle cx="87" cy="87" r="3.5"/></g>

  <g clip-path="url(#badge)">
    <!-- ONE solid horseshoe of hair: outer silhouette + inner opening only at bottom-center -->
    <path d="M 132 320
             Q 108 244 118 178
             Q 130 104 200 100
             Q 270 104 282 178
             Q 292 244 268 320
             L 214 320
             Q 226 252 228 198
             Q 231 150 200 142
             Q 169 150 172 198
             Q 174 252 186 320 Z" fill="url(#hair)"/>

    <!-- shoulders + chest base (skin) under the clothing, so the neck flows into the body -->
    <path d="M 128 400 Q 132 320 200 300 Q 268 320 272 400 Z" fill="#f5cfae"/>
    <!-- neck: connects jaw down into the shoulders -->
    <path d="M 180 236 L 180 286 Q 200 300 220 286 L 220 236 Z" fill="#f5cfae"/>
    <path d="M 180 252 Q 200 270 220 252 L 220 240 L 180 240 Z" fill="#e2ab80" opacity="0.4"/>
    <!-- collarbone/chest soft shading -->
    <path d="M 150 320 Q 200 300 250 320 Q 200 314 150 320 Z" fill="#e2ab80" opacity="0.25"/>

    <!-- blazer meeting the neck -->
    <path d="M 84 400 Q 90 298 152 282 L 248 282 Q 310 298 316 400 Z" fill="#26334d"/>
    <path d="M 152 282 L 200 400 L 248 282 Q 224 306 200 306 Q 176 306 152 282 Z" fill="#f3ead6"/>
    <path d="M 152 282 L 140 372 L 180 306 Z" fill="#1e2940"/>
    <path d="M 248 282 L 260 372 L 220 306 Z" fill="#1e2940"/>
    <circle cx="200" cy="338" r="6.5" fill="#b8960c"/><circle cx="200" cy="338" r="2.5" fill="#e6cd6a"/>

    <!-- face on top of hair -->
    <path d="M 152 172 Q 152 124 200 120 Q 248 124 248 172 Q 248 212 230 234 Q 216 250 200 250 Q 184 250 170 234 Q 152 212 152 172 Z" fill="#f5cfae"/>
    <path d="M 152 172 Q 152 146 161 134 Q 156 158 161 182 Q 154 180 152 172 Z" fill="#e6b58f" opacity="0.30"/>
    <ellipse cx="172" cy="196" rx="10" ry="6.5" fill="#eaa78c" opacity="0.5"/>
    <ellipse cx="228" cy="196" rx="10" ry="6.5" fill="#eaa78c" opacity="0.5"/>

    <!-- brows -->
    <path d="M 165 157 Q 178 151 191 156" stroke="#6b3f22" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 209 156 Q 222 151 235 157" stroke="#6b3f22" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="179" cy="171" rx="7.5" ry="8.5" fill="#fff"/><ellipse cx="221" cy="171" rx="7.5" ry="8.5" fill="#fff"/>
    <circle cx="181" cy="172" r="4.4" fill="#5a4326"/><circle cx="223" cy="172" r="4.4" fill="#5a4326"/>
    <circle cx="182.6" cy="170.4" r="1.5" fill="#fff"/><circle cx="224.6" cy="170.4" r="1.5" fill="#fff"/>
    <!-- glasses -->
    <g fill="none" stroke="#b8960c" stroke-width="3.2">
      <rect x="162" y="158" width="32" height="25" rx="10"/><rect x="206" y="158" width="32" height="25" rx="10"/>
      <path d="M 194 168 Q 200 164 206 168"/><path d="M 162 166 L 151 165"/><path d="M 238 166 L 249 165"/>
    </g>
    <!-- nose + smile -->
    <path d="M 201 177 Q 197 193 201 199 Q 205 199 206 196" stroke="#d69a70" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 182 211 Q 200 227 219 211" stroke="#b05740" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 186 213 Q 200 224 215 213 Q 200 217 186 213 Z" fill="#cf7a5e"/>
    <path d="M 189 214 Q 200 217 212 214 Q 200 215 189 214 Z" fill="#fff" opacity="0.8"/>

    <!-- front fringe on the hairline (sits on top, no gaps) -->
    <path d="M 152 176 Q 146 118 200 110 Q 254 118 248 176 Q 246 150 236 140 Q 214 150 200 148 Q 186 150 164 140 Q 154 150 152 176 Z" fill="url(#hair)"/>
    <path d="M 200 110 Q 168 114 158 146 Q 178 126 200 126 Q 190 116 200 110 Z" fill="#9a6440" opacity="0.55"/>

    <!-- earrings drawn last so they show at the jawline -->
    <circle cx="153" cy="206" r="4.5" fill="#b8960c"/><circle cx="247" cy="206" r="4.5" fill="#b8960c"/>
  </g>
</svg>
